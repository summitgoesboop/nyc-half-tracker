<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Half Marathon Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        function HalfMarathonTracker() {
            const [completedWorkouts, setCompletedWorkouts] = React.useState(() => {
                const saved = localStorage.getItem('nyc_half_completed_workouts');
                return saved ? JSON.parse(saved) : {};
            });
            const [completedPullups, setCompletedPullups] = React.useState(() => {
                const saved = localStorage.getItem('nyc_half_completed_pullups_2x');
                return saved ? JSON.parse(saved) : {};
            });
            const [activeTab, setActiveTab] = React.useState('tracker');
            const [filterPhase, setFilterPhase] = React.useState('all');

            React.useEffect(() => {
                localStorage.setItem('nyc_half_completed_workouts', JSON.stringify(completedWorkouts));
            }, [completedWorkouts]);

            React.useEffect(() => {
                localStorage.setItem('nyc_half_completed_pullups_2x', JSON.stringify(completedPullups));
            }, [completedPullups]);

            const toggleWorkout = (weekNum, dayKey) => {
                const itemKey = `w${weekNum}_${dayKey}`;
                setCompletedWorkouts(prev => ({
                    ...prev,
                    [itemKey]: !prev[itemKey]
                }));
            };

            const toggleWholeWeek = (weekNum, days) => {
                const activeDays = days.filter(d => d.val.toLowerCase() !== 'rest');
                const allActiveDone = activeDays.every(d => completedWorkouts[`w${weekNum}_${d.key}`]);

                const updated = { ...completedWorkouts };
                activeDays.forEach(d => {
                    updated[`w${weekNum}_${d.key}`] = !allActiveDone;
                });
                setCompletedWorkouts(updated);
            };

            const togglePullupSession = (weekNum, sessionNum) => {
                const itemKey = `w${weekNum}_s${sessionNum}`;
                setCompletedPullups(prev => ({
                    ...prev,
                    [itemKey]: !prev[itemKey]
                }));
            };

            const scheduleData = [
                { w: 1, phase: 1, mon: "Rest", tue: "3 mi Easy + Glute", wed: "Strength A", thu: "3 mi Easy", fri: "Rest", sat: "4 mi Easy/Cross", sun: "Rest" },
                { w: 2, phase: 1, mon: "Rest", tue: "3 mi Easy + Glute", wed: "Strength B", thu: "3.5 mi Easy", fri: "Rest", sat: "4.5 mi Easy", sun: "Rest" },
                { w: 3, phase: 1, mon: "Rest", tue: "3.5 mi Easy + Glute", wed: "Strength A", thu: "3.5 mi Easy", fri: "Rest", sat: "5 mi Easy", sun: "Rest" },
                { w: 4, phase: 1, type: "deload", mon: "Rest", tue: "3 mi Easy", wed: "Strength B", thu: "3 mi Easy", fri: "Rest", sat: "4 mi Easy", sun: "Rest" },
                { w: 5, phase: 1, mon: "Rest", tue: "4 mi Easy + Glute", wed: "Strength A", thu: "3.5 mi Easy", fri: "Rest", sat: "5.5 mi Easy", sun: "Rest" },
                { w: 6, phase: 1, mon: "Rest", tue: "4 mi Easy + Glute", wed: "Strength B", thu: "4 mi Easy", fri: "Rest", sat: "6 mi Easy", sun: "Rest" },
                { w: 7, phase: 2, mon: "Rest", tue: "4 mi + strides", wed: "Strength A", thu: "4 mi Easy", fri: "Rest", sat: "6.5 mi Long", sun: "Rest" },
                { w: 8, phase: 2, mon: "Rest", tue: "4.5 mi Easy", wed: "Strength B", thu: "4 mi Tempo", fri: "Rest", sat: "7.5 mi Long", sun: "Rest" },
                { w: 9, phase: 2, mon: "Rest", tue: "4.5 mi Easy", wed: "Strength A", thu: "4.5 mi Easy", fri: "Rest", sat: "8.5 mi Long", sun: "Rest" },
                { w: 10, phase: 2, type: "deload", mon: "Rest", tue: "3.5 mi Easy", wed: "Strength B", thu: "3.5 mi Easy", fri: "Rest", sat: "6 mi Easy", sun: "Rest" },
                { w: 11, phase: 2, mon: "Rest", tue: "5 mi Easy", wed: "Strength A", thu: "4.5 mi Easy", fri: "Rest", sat: "9.5 mi Long", sun: "Rest" },
                { w: 12, phase: 2, mon: "Rest", tue: "5 mi Easy", wed: "Strength B", thu: "5 mi Race Pace", fri: "Rest", sat: "10.5 mi Long", sun: "Rest" },
                { w: 13, phase: 2, mon: "Rest", tue: "5 mi Easy", wed: "Strength A", thu: "5 mi Easy", fri: "Rest", sat: "11.5 mi Long", sun: "Rest" },
                { w: 14, phase: 2, type: "deload", mon: "Rest", tue: "4 mi Easy", wed: "Strength B", thu: "4 mi Easy", fri: "Rest", sat: "7 mi Easy", sun: "Rest" },
                { w: 15, phase: 3, mon: "Rest", tue: "5 mi Easy", wed: "Strength A", thu: "5 mi Easy", fri: "Rest", sat: "12 mi Peak", sun: "Rest" },
                { w: 16, phase: 3, mon: "Rest", tue: "5 mi Easy", wed: "Strength B", thu: "4 mi Race Pace", fri: "Rest", sat: "10 mi Long", sun: "Rest" },
                { w: 17, phase: 3, type: "deload", mon: "Rest", tue: "4 mi Easy", wed: "Strength A", thu: "4 mi Easy", fri: "Rest", sat: "8 mi Long", sun: "Rest" },
                { w: 18, phase: 3, mon: "Rest", tue: "4.5 mi Easy", wed: "Strength B", thu: "4 mi Easy", fri: "Rest", sat: "10 mi Long", sun: "Rest" },
                { w: 19, phase: 3, type: "taper", mon: "Rest", tue: "4 mi Easy", wed: "Strength A (Light)", thu: "3.5 mi Easy", fri: "Rest", sat: "7 mi Long", sun: "Rest" },
                { w: 20, phase: 3, type: "taper", mon: "Rest", tue: "3.5 mi Easy", wed: "Glute Mobility", thu: "3 mi Easy", fri: "Rest", sat: "4 mi Shakeout", sun: "Rest" },
                { w: 21, phase: 3, type: "race", mon: "Rest", tue: "3 mi Easy", wed: "Mobility Only", thu: "2 mi Shakeout", fri: "Rest", sat: "Rest", sun: "RACE DAY (13.1 Mi)" }
            ];

            const pullupSchedule = [
                { w: 1, target: "Pyramid peak: 5 reps", details: "1-2-3-2-1 (Rest 60s between sets)" },
                { w: 2, target: "Pyramid peak: 6 reps", details: "1-2-3-4-3-2-1" },
                { w: 3, target: "Pyramid peak: 7 reps", details: "1-2-3-4-5-4-3-2-1" },
                { w: 4, target: "Deload (Peak: 5 reps)", details: "1-2-3-2-1 (Easy recovery week)" },
                { w: 5, target: "Pyramid peak: 8 reps", details: "1-2-3-4-5-6-5-4-3-2-1" },
                { w: 6, target: "Pyramid peak: 9 reps", details: "1-2-3-4-5-6-7-6-5-4-3-2-1" },
                { w: 7, target: "Pyramid peak: 10 reps", details: "1-2-3-4-5-6-7-8-7-6-5-4-3-2-1" },
                { w: 8, target: "Pyramid peak: 11 reps", details: "Add sets targeting peak of 11 strict reps" },
                { w: 9, target: "Pyramid peak: 12 reps", details: "Peak set reaches 12 strict reps" },
                { w: 10, target: "Deload (Peak: 8 reps)", details: "Deload pyramid volume" },
                { w: 11, target: "Pyramid peak: 13 reps", details: "Peak set reaches 13 strict reps" },
                { w: 12, target: "Pyramid peak: 14 reps", details: "Peak set reaches 14 strict reps" },
                { w: 13, target: "Pyramid peak: 15 reps", details: "Peak set reaches 15 strict reps" },
                { w: 14, target: "Deload (Peak: 10 reps)", details: "Deload pyramid volume" },
                { w: 15, target: "Pyramid peak: 17 reps", details: "Scaling up peak towards target goal" },
                { w: 16, target: "Pyramid peak: 19 reps", details: "Heavy endurance phase" },
                { w: 17, target: "Deload (Peak: 12 reps)", details: "Recovery week" },
                { w: 18, target: "Pyramid peak: 21 reps", details: "Final heavy strength block" },
                { w: 19, target: "Taper Peak: 23 reps", details: "Attempt max strict set / peak pyramid" },
                { w: 20, target: "Taper Maintenance", details: "Light ladder sets (max 10 reps)" },
                { w: 21, target: "Race Week Freshness", details: "Rest / light bar hangs only" }
            ];

            let totalActiveWorkouts = 0;
            let completedActiveWorkouts = 0;

            scheduleData.forEach(item => {
                const days = [
                    { key: 'tue', val: item.tue },
                    { key: 'wed', val: item.wed },
                    { key: 'thu', val: item.thu },
                    { key: 'sat', val: item.sat },
                    { key: 'sun', val: item.sun }
                ];
                days.forEach(d => {
                    if (d.val.toLowerCase() !== 'rest') {
                        totalActiveWorkouts++;
                        if (completedWorkouts[`w${item.w}_${d.key}`]) {
                            completedActiveWorkouts++;
                        }
                    }
                });
            });

            const progressPct = totalActiveWorkouts > 0 ? Math.round((completedActiveWorkouts / totalActiveWorkouts) * 100) : 0;

            let totalPullupSessions = pullupSchedule.length * 2;
            let completedPullupSessions = 0;
            pullupSchedule.forEach(p => {
                if (completedPullups[`w${p.w}_s1`]) completedPullupSessions++;
                if (completedPullups[`w${p.w}_s2`]) completedPullupSessions++;
            });

            const filteredWeeks = scheduleData.filter(item => {
                if (filterPhase === 'all') return true;
                return item.phase.toString() === filterPhase;
            });

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6 font-sans">
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white rounded-2xl p-6 shadow-lg mb-6">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <span className="bg-blue-500/30 text-blue-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">March 21, 2027</span>
                                <h1 className="text-2xl sm:text-3xl font-bold mt-2">United NYC Half Marathon Plan</h1>
                                <p className="text-blue-200 text-sm mt-1">Low-impact volume management, ITBS glute activation & 23 Strict Pull-Up Goal</p>
                            </div>
                            <div className="bg-white/10 backdrop-blur-md rounded-xl p-4 text-center min-w-[140px]">
                                <div className="text-3xl font-bold">{progressPct}%</div>
                                <div className="text-xs text-blue-200 uppercase tracking-wider font-medium mt-0.5">{completedActiveWorkouts} of {totalActiveWorkouts} Workouts</div>
                            </div>
                        </div>
                        <div className="w-full bg-blue-900/50 rounded-full h-2.5 mt-5 overflow-hidden">
                            <div className="bg-emerald-400 h-2.5 rounded-full transition-all duration-500" style={{ width: `${progressPct}%` }}></div>
                        </div>
                    </div>

                    <div className="flex overflow-x-auto gap-2 bg-white p-1.5 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <button onClick={() => setActiveTab('tracker')} className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all whitespace-nowrap ${activeTab === 'tracker' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}>📅 Daily Schedule</button>
                        <button onClick={() => setActiveTab('pullup')} className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all whitespace-nowrap ${activeTab === 'pullup' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}>🧗 Pull-Up Pyramid ({completedPullupSessions}/{totalPullupSessions})</button>
                        <button onClick={() => setActiveTab('glute')} className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all whitespace-nowrap ${activeTab === 'glute' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}>🔥 Glute Activation</button>
                        <button onClick={() => setActiveTab('strength')} className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all whitespace-nowrap ${activeTab === 'strength' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}>🏋️ Strength Routines</button>
                        <button onClick={() => setActiveTab('rules')} className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all whitespace-nowrap ${activeTab === 'rules' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}>🛡️ ITBS Rules</button>
                    </div>

                    {activeTab === 'tracker' && (
                        <div className="space-y-4">
                            <div className="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                <span className="text-sm font-medium text-slate-700">Filter Phase:</span>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={() => setFilterPhase('all')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${filterPhase === 'all' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>All Weeks</button>
                                    <button onClick={() => setFilterPhase('1')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${filterPhase === '1' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Phase 1 (W1-6)</button>
                                    <button onClick={() => setFilterPhase('2')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${filterPhase === '2' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Phase 2 (W7-14)</button>
                                    <button onClick={() => setFilterPhase('3')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${filterPhase === '3' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Phase 3 (W15-21)</button>
                                </div>
                            </div>

                            <div className="space-y-3">
                                {filteredWeeks.map((item) => {
